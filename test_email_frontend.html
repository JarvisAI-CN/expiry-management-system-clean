<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>邮件发送功能验证</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card">
                    <div class="card-header">
                        <h4>📧 邮件发送功能验证</h4>
                    </div>
                    <div class="card-body">
                        <div class="alert alert-info">
                            <strong>测试目的:</strong> 验证邮件发送功能是否正常工作
                        </div>
                        
                        <div class="mb-3">
                            <label class="form-label">测试类型:</label>
                            <select class="form-select" id="testType">
                                <option value="simple">简单测试</option>
                                <option value="inventory">盘点单邮件测试</option>
                            </select>
                        </div>
                        
                        <div class="mb-3">
                            <label class="form-label">收件人邮箱:</label>
                            <input type="email" class="form-control" id="recipientEmail" value="1667235636@qq.com">
                        </div>
                        
                        <button class="btn btn-primary" onclick="runTest()">
                            <i class="bi bi-send"></i> 开始测试
                        </button>
                        
                        <div id="result" class="mt-3" style="display: none;"></div>
                    </div>
                </div>
                
                <div class="card mt-3">
                    <div class="card-header">
                        <h5>调试日志</h5>
                    </div>
                    <div class="card-body">
                        <button class="btn btn-sm btn-outline-primary" onclick="viewDebugLog()">
                            <i class="bi bi-file-text"></i> 查看调试日志
                        </button>
                        <button class="btn btn-sm btn-outline-secondary" onclick="clearDebugLog()">
                            <i class="bi bi-trash"></i> 清除日志
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <script>
        async function runTest() {
            const testType = document.getElementById('testType').value;
            const recipient = document.getElementById('recipientEmail').value;
            const resultDiv = document.getElementById('result');
            
            resultDiv.style.display = 'block';
            resultDiv.innerHTML = '<div class="alert alert-info">测试进行中...</div>';
            
            try {
                if (testType === 'simple') {
                    // 简单测试
                    const res = await fetch('test_send_email_simple.php', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            to: recipient,
                            subject: '测试邮件 - ' + new Date().toLocaleString(),
                            body: '这是一封测试邮件，用于验证邮件发送功能是否正常。'
                        })
                    });
                    
                    const d = await res.json();
                    
                    if (d.success) {
                        resultDiv.innerHTML = `
                            <div class="alert alert-success">
                                <strong>✅ 测试成功!</strong><br>
                                邮件已成功发送到: ${recipient}<br>
                                ${d.message || ''}
                            </div>
                        `;
                    } else {
                        resultDiv.innerHTML = `
                            <div class="alert alert-danger">
                                <strong>❌ 测试失败!</strong><br>
                                ${d.message || '未知错误'}
                            </div>
                        `;
                    }
                } else {
                    // 盘点单邮件测试
                    const testData = {
                        subject: '盘点单汇总 - 测试',
                        body: `
                            <h3>测试盘点单</h3>
                            <p><strong>盘点时间:</strong> ${new Date().toLocaleString()}</p>
                            <p><strong>商品数量:</strong> 1 件</p>
                            <table border="1" cellpadding="8" cellspacing="0" style="border-collapse: collapse; width: 100%;">
                                <thead>
                                    <tr style="background-color: #f0f0f0;">
                                        <th>商品SKU</th>
                                        <th>商品名称</th>
                                        <th>到期日期</th>
                                        <th>数量</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr>
                                        <td>11183058</td>
                                        <td>橙柚柠檬果酱</td>
                                        <td>2026-02-22</td>
                                        <td style="text-align: center;">1</td>
                                    </tr>
                                </tbody>
                            </table>
                        `
                    };
                    
                    const res = await fetch('index.php?api=send_inventory_email', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(testData)
                    });
                    
                    const d = await res.json();
                    
                    if (d.success) {
                        resultDiv.innerHTML = `
                            <div class="alert alert-success">
                                <strong>✅ 测试成功!</strong><br>
                                盘点单邮件已成功发送到: ${recipient}<br>
                                ${d.message || ''}
                            </div>
                        `;
                    } else {
                        resultDiv.innerHTML = `
                            <div class="alert alert-danger">
                                <strong>❌ 测试失败!</strong><br>
                                ${d.message || '未知错误'}<br>
                                ${d.error || ''}
                            </div>
                        `;
                    }
                }
            } catch (error) {
                resultDiv.innerHTML = `
                    <div class="alert alert-danger">
                        <strong>❌ 网络错误!</strong><br>
                        ${error.message}
                    </div>
                `;
            }
        }
        
        function viewDebugLog() {
            window.open('view_debug_log.php', '_blank');
        }
        
        async function clearDebugLog() {
            if (!confirm('确定要清除调试日志吗？')) {
                return;
            }
            
            const res = await fetch('clear_debug_log.php');
            const d = await res.json();
            
            if (d.success) {
                alert('调试日志已清除');
            } else {
                alert('清除失败: ' + (d.message || '未知错误'));
            }
        }
    </script>
</body>
</html>
