<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>邮件系统诊断</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-5">
        <div class="card shadow">
            <div class="card-header bg-primary text-white">
                <h4 class="mb-0">🔧 邮件系统诊断工具</h4>
            </div>
            <div class="card-body">
                <div id="results"></div>
            </div>
        </div>
    </div>
    <script>
        async function checkSystem() {
            const results = document.getElementById('results');
            results.innerHTML = '<div class="text-center"><div class="spinner-border" role="status"></div><p>正在检查...</p></div>';
            
            try {
                const res = await fetch('email_diagnostic.php');
                const data = await res.json();
                
                let html = '<div class="list-group">';
                
                // 检查email_functions.php
                if (data.email_functions_exists) {
                    html += '<div class="list-group-item list-group-item-success">✅ email_functions.php 存在</div>';
                } else {
                    html += '<div class="list-group-item list-group-item-danger">❌ email_functions.php 不存在</div>';
                }
                
                // 检查email_accounts表
                if (data.email_accounts_table_exists) {
                    html += '<div class="list-group-item list-group-item-success">✅ email_accounts 表存在</div>';
                    
                    // 检查活跃邮箱数量
                    if (data.active_email_count > 0) {
                        html += `<div class="list-group-item list-group-item-success">✅ 有 ${data.active_email_count} 个活跃邮箱账户</div>`;
                    } else {
                        html += '<div class="list-group-item list-group-item-warning">⚠️ 没有活跃的邮箱账户，请去后台添加</div>';
                    }
                } else {
                    html += '<div class="list-group-item list-group-item-danger">❌ email_accounts 表不存在，请运行 <a href="upgrade_to_v2.14.php" class="btn btn-sm btn-primary">升级脚本</a></div>';
                }
                
                // 检查默认收件邮箱
                if (data.default_recipient_email) {
                    html += `<div class="list-group-item list-group-item-success">✅ 默认收件邮箱: ${data.default_recipient_email}</div>`;
                } else {
                    html += '<div class="list-group-item list-group-item-warning">⚠️ 未设置默认收件邮箱，请去后台"AI配置"页面设置</div>';
                }
                
                html += '</div>';
                
                // 添加操作建议
                html += '<div class="mt-4 alert alert-info">';
                html += '<h5>📋 操作步骤：</h5>';
                html += '<ol>';
                if (!data.email_accounts_table_exists) {
                    html += '<li>先运行 <a href="upgrade_to_v2.14.php" class="alert-link">upgrade_to_v2.14.php</a> 升级数据库</li>';
                }
                if (!data.email_functions_exists || data.email_accounts_table_exists === false) {
                    html += '<li>如果缺少文件，联系管理员重新上传</li>';
                }
                if (data.email_accounts_table_exists && data.active_email_count === 0) {
                    html += '<li>去后台"邮箱配置"添加QQ邮箱账户</li>';
                }
                if (data.email_accounts_table_exists && !data.default_recipient_email) {
                    html += '<li>去后台"AI配置"设置默认收件邮箱</li>';
                }
                html += '</ol>';
                html += '</div>';
                
                results.innerHTML = html;
            } catch (error) {
                results.innerHTML = '<div class="alert alert-danger">❌ 诊断失败: ' + error.message + '</div>';
            }
        }
        
        checkSystem();
    </script>
</body>
</html>
