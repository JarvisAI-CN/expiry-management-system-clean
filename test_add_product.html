<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>添加商品功能测试页面</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body>
    <div class="container mt-5">
        <h1 class="mb-4">🧪 添加商品功能测试</h1>

        <div class="card">
            <div class="card-body">
                <h5 class="card-title">功能测试</h5>
                <p class="card-text">测试编辑界面添加商品的各项功能</p>

                <button class="btn btn-primary" onclick="testAddProduct()">测试添加商品功能</button>
            </div>
        </div>

        <div id="testResults" class="mt-4"></div>
    </div>

    <script>
        async function testAddProduct() {
            const resultsDiv = document.getElementById('testResults');
            resultsDiv.innerHTML = '<div class="alert alert-info">正在测试...</div>';

            const tests = [];

            // 测试1: 检查API是否存在
            try {
                const res = await fetch('http://pandian.dhmip.cn/index.php?api=search_products&q=1');
                const data = await res.json();
                tests.push({
                    name: '搜索API',
                    status: data.success ? '通过' : '失败',
                    message: data.success ? 'API正常工作' : 'API返回失败'
                });
            } catch (error) {
                tests.push({
                    name: '搜索API',
                    status: '失败',
                    message: '无法连接到API: ' + error.message
                });
            }

            // 测试2: 检查模糊搜索功能
            try {
                const res = await fetch('http://pandian.dhmip.cn/index.php?api=search_products&q=1');
                const data = await res.json();
                tests.push({
                    name: '模糊搜索',
                    status: data.success ? '通过' : '失败',
                    message: data.success ? `找到${data.data.length}个商品` : '搜索失败'
                });
            } catch (error) {
                tests.push({
                    name: '模糊搜索',
                    status: '失败',
                    message: '搜索失败: ' + error.message
                });
            }

            // 显示测试结果
            let html = '<h5 class="mt-4">测试结果</h5>';
            tests.forEach(test => {
                const alertClass = test.status === '通过' ? 'alert-success' : 'alert-danger';
                html += `
                    <div class="alert ${alertClass}">
                        <strong>${test.name}:</strong> ${test.status}<br>
                        <small>${test.message}</small>
                    </div>
                `;
            });

            html += `
                <div class="alert alert-info mt-3">
                    <strong>使用说明:</strong><br>
                    1. 请清除浏览器缓存（Ctrl+F5）<br>
                    2. 刷新页面后再测试<br>
                    3. 如果问题仍然存在，请联系开发者
                </div>
            `;

            resultsDiv.innerHTML = html;
        }
    </script>
</body>
</html>
